name: Android CI - Build APK
on:
  push:
    branches:
      - feature/brilliant-integration
  pull_request:
    branches:
      - master

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint || true
      - name: Run tests
        run: npm test || true

  eas-build:
    needs: lint-and-test
    if: github.event_name == 'push' && contains(github.ref, 'feature/brilliant-integration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install EAS CLI
        run: npm ci && npm install -g eas-cli
      - name: Login to EAS
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          if [ -z "$EAS_TOKEN" ]; then echo "EAS_TOKEN not set - skipping eas build"; exit 0; fi
          eas whoami
      - name: Trigger EAS build (android - production)
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          eas build --platform android --profile production --non-interactive
